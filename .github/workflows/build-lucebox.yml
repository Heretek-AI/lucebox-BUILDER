name: Build lucebox

on:
  workflow_dispatch:
    inputs:
      cuda_architectures:
        description: 'CUDA architectures for the fat binary (semicolon-separated)'
        required: false
        default: '75;80;86;89;90;120'
      gfx_target:
        description: 'AMD GPU targets to build (comma-separated: gfx1151,gfx1100,gfx1201[,gfx1200])'
        required: false
        default: 'gfx1151,gfx1100,gfx1201'
      rocm_version:
        description: 'ROCm version to use (e.g., 7.15.0a20260728) or "latest" to auto-detect'
        required: false
        default: 'latest'
      lucebox_version:
        description: 'lucebox version (tag, branch, commit hash, or "main")'
        required: false
        default: 'main'
      create_release:
        description: 'Create a GitHub release after successful build'
        required: false
        default: true
        type: boolean
      hip_sm80_equiv:
        description: 'Enable rocWMMA Phase-2 flashprefill kernels (TheRock dists bundle rocwmma headers)'
        required: false
        default: false
        type: boolean
      run_unit_tests:
        description: 'Run CPU unit tests (ctest server_unit) inside build jobs'
        required: false
        default: false
        type: boolean

  # Trigger on pull requests (build only — no release)
  pull_request:
    types: [opened, synchronize, reopened]

  # Nightly build schedule at 13:00 UTC (5:00 AM PST)
  schedule:
    - cron: '0 13 * * *'

env:
  CUDA_ARCHES: ${{ github.event.inputs.cuda_architectures || '75;80;86;89;90;120' }}
  GFX_TARGETS: ${{ github.event.inputs.gfx_target || 'gfx1151,gfx1100,gfx1201' }}
  ROCM_VERSION: ${{ github.event.inputs.rocm_version || 'latest' }}
  LUCEBOX_VERSION: ${{ github.event.inputs.lucebox_version || 'main' }}
  HIP_SM80_EQUIV: ${{ github.event.inputs.hip_sm80_equiv == 'true' && 'ON' || 'OFF' }}
  RUN_UNIT_TESTS: ${{ github.event.inputs.run_unit_tests == 'true' && 'ON' || 'OFF' }}
  LUCEBOX_REPO_URL: https://github.com/Luce-Org/lucebox

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # prepare-matrix: validate targets, map chips -> TheRock dist prefixes,
  # auto-detect ROCm versions once per distinct prefix, resolve the upstream
  # commit hash, and derive the smoke-test matrix from repo variables.
  # Centralizing nondeterministic values here keeps build/release jobs pure
  # consumers (per-leg outputs would race when several legs finish).
  # ──────────────────────────────────────────────────────────────────────
  prepare-matrix:
    runs-on: ubuntu-22.04
    outputs:
      rocm_matrix: ${{ steps.set-matrix.outputs.rocm_matrix }}
      smoke_matrix: ${{ steps.set-matrix.outputs.smoke_matrix }}
      should_build_rocm: ${{ steps.set-matrix.outputs.should_build_rocm }}
      versions_json: ${{ steps.detect.outputs.versions_json }}
      lucebox_commit_hash: ${{ steps.upstream.outputs.hash }}
    env:
      RUNNERS_GFX1151: ${{ vars.LUCEBOX_RUNNERS_GFX1151 }}
      RUNNERS_GFX1201: ${{ vars.LUCEBOX_RUNNERS_GFX1201 }}
      RUNNERS_GFX1100: ${{ vars.LUCEBOX_RUNNERS_GFX1100 }}
      RUNNERS_CUDA: ${{ vars.LUCEBOX_RUNNERS_CUDA }}
    steps:
    - name: Set matrices
      id: set-matrix
      env:
        GFX_TARGETS: ${{ env.GFX_TARGETS }}
      run: |
        set -euo pipefail
        echo "Input gfx targets: ${GFX_TARGETS}"

        # Chip -> TheRock tarball-multi-arch dist prefix. TheRock publishes
        # single-chip dists only for gfx115x; RDNA3/RDNA4 ship as family
        # dists (`gfx110X-all`, `gfx120X-all`). We compile against one chip
        # regardless (-DDFLASH27B_HIP_ARCHITECTURES), so each shipped binary
        # stays single-gfx even though its toolchain came from a family dist.
        declare -A S3_PREFIX=(
          [gfx1151]=gfx1151
          [gfx1100]=gfx110X-all
          [gfx1201]=gfx120X-all
          [gfx1200]=gfx120X-all
        )

        allowlist="gfx1151 gfx1100 gfx1201 gfx1200"
        target_list=$(echo "${GFX_TARGETS}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' || true)
        if [ -z "$target_list" ]; then
          echo "No gfx targets requested" >&2
          exit 1
        fi

        legs=()
        prefixes=""
        for t in $target_list; do
          if ! echo " $allowlist " | grep -q " $t "; then
            echo "::error::Unsupported gfx target '$t'. Supported: $allowlist" >&2
            exit 1
          fi
          p="${S3_PREFIX[$t]}"
          legs+=("{\"backend\":\"hip\",\"gfx_target\":\"$t\",\"s3_target\":\"$p\"}")
          case " $prefixes " in *" $p "*) ;; *) prefixes="$prefixes $p";; esac
        done

        printf 'rocm_matrix=%s\n' "{\"include\":[$(IFS=,; echo "${legs[*]}")]}" >> "$GITHUB_OUTPUT"
        echo "should_build_rocm=true" >> "$GITHUB_OUTPUT"

        # Smoke matrix: only targets that both were requested AND have a
        # runner-label repo variable configured. Jobs for unset variables
        # simply never materialize (an empty/missing label would otherwise
        # queue forever waiting for a nonexistent runner).
        declare -A RUNNER_VAR=(
          [gfx1151]="$RUNNERS_GFX1151"
          [gfx1201]="$RUNNERS_GFX1201"
          [gfx1100]="$RUNNERS_GFX1100"
        )
        smoke="[]"
        for t in $target_list; do
          labels="${RUNNER_VAR[$t]:-}"
          [ -n "$labels" ] || continue
          echo "$labels" | jq -e 'type == "array"' >/dev/null \
            || { echo "::error::LUCEBOX_RUNNERS_${t^^} must be a JSON array of runner labels, got: $labels" >&2; exit 1; }
          smoke=$(echo "$smoke" | jq -c --arg t "$t" --argjson l "$labels" '. + [{gfx_target:$t, runner_labels:$l}]')
        done
        if [ -n "${RUNNERS_CUDA:-}" ]; then
          echo "$RUNNERS_CUDA" | jq -e 'type == "array"' >/dev/null \
            || { echo "::error::LUCEBOX_RUNNERS_CUDA must be a JSON array of runner labels, got: $RUNNERS_CUDA" >&2; exit 1; }
          smoke=$(echo "$smoke" | jq -c --argjson l "$RUNNERS_CUDA" '. + [{gfx_target:"cuda", runner_labels:$l}]')
        fi
        echo "smoke_matrix=$smoke" >> "$GITHUB_OUTPUT"

        echo "ROCm matrix: {\"include\":[${legs[*]:-}]}"
        echo "Distinct TheRock prefixes:$prefixes"
        echo "Smoke matrix: $smoke"
        echo "prefixes=$prefixes" >> "$GITHUB_ENV"

    - name: Detect ROCm versions
      id: detect
      env:
        ROCM_VERSION: ${{ env.ROCM_VERSION }}
      run: |
        set -euo pipefail
        # No ROCm legs requested (empty prefix list): emit an empty map so
        # downstream consumers degrade gracefully.
        if [ -z "${prefixes:-}" ]; then
          echo "versions_json={}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        base_url="https://rocm.nightlies.amd.com/tarball-multi-arch"
        versions_json="{"
        for p in $prefixes; do
          if [ "$ROCM_VERSION" = "latest" ]; then
            files_json=$(curl -sf "$base_url/" | tr '\n' ' ' | grep -oP 'const files = \K\[.*?\](?=\s*;)') \
              || { echo "::error::Failed to parse file index from $base_url/" >&2; exit 1; }
            prefix="therock-dist-linux-${p}-"
            latest_file=$(echo "$files_json" | jq -r --arg p "$prefix" \
              '[.[] | select(.name | test("^" + $p + "[0-9]+\\.[0-9]+\\.[0-9]+(a|rc)[0-9]+\\.tar\\.gz$"))] | sort_by(.name | capture("(?<d>[0-9]{8})\\.tar\\.gz$").d) | last | .name // empty')
            if [ -z "$latest_file" ]; then
              echo "::error::No tarball found for prefix '$prefix' at $base_url/" >&2
              exit 1
            fi
            if [[ "$latest_file" =~ therock-dist-linux-(.*)-([0-9]+\.[0-9]+\.[0-9]+(a|rc)[0-9]+)\.tar\.gz ]]; then
              detected="${BASH_REMATCH[2]}"
            else
              echo "::error::Failed to extract ROCm version from: $latest_file" >&2
              exit 1
            fi
            echo "$p -> $detected ($latest_file)"
          else
            detected="$ROCM_VERSION"
            echo "$p -> $detected (pinned)"
          fi
          versions_json="${versions_json}\"${p}\":\"${detected}\","
        done
        versions_json="${versions_json%,}}"
        echo "versions_json=$versions_json" >> "$GITHUB_OUTPUT"

    - name: Resolve upstream commit hash
      id: upstream
      env:
        LUCEBOX_VERSION: ${{ env.LUCEBOX_VERSION }}
        LUCEBOX_REPO_URL: ${{ env.LUCEBOX_REPO_URL }}
      run: |
        set -euo pipefail
        v="$LUCEBOX_VERSION"
        if [ "$v" = "latest" ] || [ "$v" = "main" ]; then
          git clone --depth 1 --single-branch --branch main "$LUCEBOX_REPO_URL.git" src
        else
          git clone --depth 1 --single-branch --branch "$v" "$LUCEBOX_REPO_URL.git" src
        fi
        echo "hash=$(git -C src rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
        git -C src log --oneline -1

  # ──────────────────────────────────────────────────────────────────────
  # build-cuda: single fat-binary job (nvcc 12.8 covers sm_75..sm_120).
  # NOTE: server/CMakeLists.txt force-overwrites CMAKE_CUDA_ARCHITECTURES
  # from its own auto-resolved list unless DFLASH27B_USER_CUDA_ARCHITECTURES
  # is also passed — both flags below are load-bearing.
  # Binaries/libraries land flat in server/build/ (the project sets
  # CMAKE_RUNTIME_OUTPUT_DIRECTORY to the build root), so we stage a dist/
  # tree rather than uploading build/bin/.
  # ──────────────────────────────────────────────────────────────────────
  build-cuda:
    name: build-cuda
    runs-on: ubuntu-22.04
    needs: prepare-matrix
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae27d1e11a3db4fd47069af60e637ba35a8/ci/scripts/util_free_space.sh | bash

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build patchelf libcurl4-openssl-dev pkg-config

    - name: Install CUDA toolkit 12.8
      id: cuda-toolkit
      uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
      with:
        cuda: '12.8.0'
        method: network
        sub-packages: '["nvcc", "cudart-dev", "thrust", "driver-dev"]'
        non-cuda-sub-packages: '["libcublas-dev"]'

    - name: Provide CUDA driver stub for linking
      # nvidia/cuda:*-devel images and the network-installed toolkit ship the
      # driver stub as libcuda.so but not libcuda.so.1; without the symlink
      # the dflash link step fails with `undefined reference to cuMem*`.
      # At runtime the host driver provides the real libcuda.so.1.
      run: |
        mkdir -p "$RUNNER_TEMP/cuda-stubs"
        ln -sf "$CUDA_PATH/targets/x86_64-linux/lib/stubs/libcuda.so" \
          "$RUNNER_TEMP/cuda-stubs/libcuda.so.1"
        {
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/cuda-stubs:/usr/local/cuda-12.8/targets/x86_64-linux/lib/stubs:${LD_LIBRARY_PATH:-}"
        } >> "$GITHUB_ENV"

    - name: Clone lucebox
      run: |
        set -euo pipefail
        version="${{ env.LUCEBOX_VERSION }}"
        if [ "$version" = "latest" ] || [ "$version" = "main" ]; then
          git clone --depth 1 --single-branch --branch main "${{ env.LUCEBOX_REPO_URL }}.git"
        else
          git clone --depth 1 --single-branch --branch "$version" "${{ env.LUCEBOX_REPO_URL }}.git"
        fi
        cd lucebox
        git log --oneline -1
        # BSA is disabled for these builds, but assert the vendored ggml is intact.
        test -f server/deps/llama.cpp/ggml/CMakeLists.txt \
          || { echo "ERROR: missing vendored ggml sources at server/deps/llama.cpp/ggml" >&2; exit 1; }

    - name: Build lucebox (CUDA fat binary)
      run: |
        set -euo pipefail
        cd lucebox/server
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
          -DDFLASH27B_USER_CUDA_ARCHITECTURES="${{ env.CUDA_ARCHES }}" \
          -DCMAKE_CUDA_ARCHITECTURES="${{ env.CUDA_ARCHES }}" \
          -DDFLASH27B_ENABLE_BSA=OFF \
          -DDFLASH27B_FA_ALL_QUANTS=OFF
        cmake --build build --target test_dflash dflash_server test_server_unit -j"$(nproc)"

    - name: Run CPU unit tests
      if: env.RUN_UNIT_TESTS == 'ON'
      working-directory: lucebox/server/build
      run: ctest --output-on-failure -R "server_unit|deepseek4_unit|feature_gate|seq_slot_manager|seq_engine_contract|seq_batch_plan|client_send_buffer" --no-tests=error

    - name: Stage distribution
      # Executables and ggml shared libs land flat in server/build/ (see job
      # header comment); collect them into a portable dist/ tree.
      run: |
        set -euo pipefail
        build_dir="lucebox/server/build"
        mkdir -p dist/bin/share
        cp -v "$build_dir/dflash_server" "$build_dir/test_dflash" "$build_dir/test_server_unit" dist/bin/
        cp -v "$build_dir/share/status.html" dist/bin/share/ 2>/dev/null || true
        find "$build_dir" -name 'libggml*.so*' -exec cp -L {} dist/bin/ \;
        # Bundle cudart unless ggml linked it statically; harmless either way.
        cp -L "$CUDA_PATH/lib64/libcudart.so.12" dist/bin/ 2>/dev/null || true
        cd dist/bin
        for f in *; do
          [ -f "$f" ] && [ ! -L "$f" ] && patchelf --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
        done

    - name: Verify CUDA binaries
      run: |
        set -euo pipefail
        bin_dir="dist/bin"
        ls -la "$bin_dir"
        for b in test_dflash dflash_server test_server_unit; do
          test -x "$bin_dir/$b" || { echo "ERROR: $b not staged" >&2; exit 1; }
        done
        help_out=$("$bin_dir/dflash_server" --help 2>&1 || true)
        echo "$help_out" | head -n 10
        # Usage goes to stderr
        echo "$help_out" | grep -q "Usage:" || { echo "ERROR: usage output missing" >&2; exit 1; }
        # ldd audit: every NEEDED must resolve (system, bundled, or driver stub)
        for b in test_dflash dflash_server test_server_unit; do
          unresolved=$(LD_LIBRARY_PATH="$RUNNER_TEMP/cuda-stubs:${LD_LIBRARY_PATH:-}" ldd "$bin_dir/$b" | grep "not found" || true)
          if [ -n "$unresolved" ]; then
            echo "ERROR: unresolved libs for $b:" >&2
            echo "$unresolved" >&2
            exit 1
          fi
        done
        echo "CUDA binary verification successful!"

    - name: Upload build artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lucebox-linux-cuda12-x64
        path: dist/
        retention-days: 30

    - name: Clean up workspace
      if: always()
      run: |
        rm -rf dist
        if [ -d "lucebox" ]; then rm -rf lucebox; fi

  # ──────────────────────────────────────────────────────────────────────
  # build-rocm: one job per gfx chip. Toolchain comes from the TheRock dist
  # mapped by prepare-matrix (family dist for RDNA3/RDMA4, single-chip for
  # gfx115x) while the compile target stays the single requested chip.
  # ──────────────────────────────────────────────────────────────────────
  build-rocm:
    name: build-rocm (${{ matrix.gfx_target }})
    runs-on: ubuntu-22.04
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.should_build_rocm == 'true'
    timeout-minutes: 150
    strategy:
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.rocm_matrix) }}
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae27d1e11a3db4fd47069af60e637ba35a8/ci/scripts/util_free_space.sh | bash

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build patchelf libcurl4-openssl-dev pkg-config python3

    - name: Download and extract ROCm directly to /opt/rocm
      run: |
        set -euo pipefail
        base_url="https://rocm.nightlies.amd.com/tarball-multi-arch"
        s3_target="${{ matrix.s3_target }}"
        if [ "${{ env.ROCM_VERSION }}" = "latest" ]; then
          rocm_version=$(jq -r --arg p "$s3_target" '.[$p]' <<<'${{ needs.prepare-matrix.outputs.versions_json }}')
        else
          rocm_version="${{ env.ROCM_VERSION }}"
        fi
        rocm_url="$base_url/therock-dist-linux-${s3_target}-${rocm_version}.tar.gz"
        echo "Downloading $rocm_url"
        echo "DETECTED_ROCM_VERSION=$rocm_version" >> "$GITHUB_ENV"
        sudo mkdir -p /opt/rocm
        curl -sfL "$rocm_url" | sudo tar --use-compress-program=gzip -xf - -C /opt/rocm --strip-components=1

    - name: Set ROCm environment variables
      run: |
        echo "HIP_PATH=/opt/rocm" >> "$GITHUB_ENV"
        echo "ROCM_PATH=/opt/rocm" >> "$GITHUB_ENV"
        echo "HIP_PLATFORM=amd" >> "$GITHUB_ENV"
        echo "HIP_CLANG_PATH=/opt/rocm/llvm/bin" >> "$GITHUB_ENV"
        echo "HIP_INCLUDE_PATH=/opt/rocm/include" >> "$GITHUB_ENV"
        echo "HIP_LIB_PATH=/opt/rocm/lib" >> "$GITHUB_ENV"
        echo "HIP_DEVICE_LIB_PATH=/opt/rocm/lib/llvm/amdgcn/bitcode" >> "$GITHUB_ENV"
        echo "/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64:/opt/rocm/llvm/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        echo "LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        echo "CPATH=/opt/rocm/include:${CPATH:-}" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=/opt/rocm/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

    - name: Probe optional rocWMMA headers
      # DFLASH27B_HIP_SM80_EQUIV=ON needs rocwmma headers. Verified present in
      # current TheRock dists, but keep the cheap fail-fast in case AMD drops
      # them from a future nightly.
      if: env.HIP_SM80_EQUIV == 'ON'
      run: |
        found=0
        for p in /opt/rocm/include/rocwmma/rocwmma.hpp /opt/rocm/include/rocwmma.hpp /opt/rocm/include/rocwmma; do
          if [ -e "$p" ]; then found=1; echo "Found rocwmma at $p"; break; fi
        done
        if [ "$found" = "0" ]; then
          echo "ERROR: hip_sm80_equiv requested but the ROCm dist at /opt/rocm has no rocwmma headers." >&2
          echo "Pin an older/newer ROCm via the rocm_version dispatch input, or rebuild locally per docs/manual_instructions.md." >&2
          exit 1
        fi

    - name: Clone lucebox
      run: |
        set -euo pipefail
        version="${{ env.LUCEBOX_VERSION }}"
        if [ "$version" = "latest" ] || [ "$version" = "main" ]; then
          git clone --depth 1 --single-branch --branch main "${{ env.LUCEBOX_REPO_URL }}.git"
        else
          git clone --depth 1 --single-branch --branch "$version" "${{ env.LUCEBOX_REPO_URL }}.git"
        fi
        cd lucebox
        git log --oneline -1
        # No Block-Sparse-Attention submodule init needed: BSA is OFF for these builds.
        test -f server/deps/llama.cpp/ggml/CMakeLists.txt \
          || { echo "ERROR: missing vendored ggml sources at server/deps/llama.cpp/ggml" >&2; exit 1; }

    - name: Build lucebox (HIP)
      run: |
        set -euo pipefail
        cd lucebox/server
        cmake -B build -G Ninja \
          -DCMAKE_C_COMPILER=/opt/rocm/llvm/bin/clang \
          -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
          -DDFLASH27B_GPU_BACKEND=hip \
          -DDFLASH27B_HIP_ARCHITECTURES="${{ matrix.gfx_target }}" \
          -DDFLASH27B_HIP_SM80_EQUIV=${{ env.HIP_SM80_EQUIV }} \
          -DDFLASH27B_FA_ALL_QUANTS=OFF \
          -DDFLASH27B_ENABLE_BSA=OFF \
          -DCMAKE_HIP_FLAGS=-DDFLASH_WAVE_SIZE=32
        cmake --build build --target test_dflash dflash_server test_server_unit -j"$(nproc)"

    - name: Run CPU unit tests
      if: env.RUN_UNIT_TESTS == 'ON'
      working-directory: lucebox/server/build
      run: ctest --output-on-failure -R "server_unit|deepseek4_unit|feature_gate|seq_slot_manager|seq_engine_contract|seq_batch_plan|client_send_buffer" --no-tests=error

    - name: Stage distribution
      # Portable layout:
      #   dist/bin/           binaries + ggml libs + bundled ROCm runtime libs
      #   dist/bin/rocblas/library/   rocblas kernel tree (resolved relative
      #                       to the loading librocblas.so's directory)
      #   dist/kpacks/        per-gfx rocm_kpack packs; renamed to .kpack/
      #                       (sibling of bin/) at zip time because
      #                       upload-artifact drops hidden directories
      run: |
        set -euo pipefail
        gfx="${{ matrix.gfx_target }}"
        build_dir="lucebox/server/build"
        mkdir -p dist/bin/share dist/bin/rocblas/library dist/kpacks
        cp -v "$build_dir/dflash_server" "$build_dir/test_dflash" "$build_dir/test_server_unit" dist/bin/
        cp -v "$build_dir/share/status.html" dist/bin/share/ 2>/dev/null || true
        find "$build_dir" -name 'libggml*.so*' -exec cp -L {} dist/bin/ \;

        # Lean runtime list: ggml's HIP path uses hipblas -> rocblas plus the
        # HIP runtime and HSA. No hipBLASLt/rocsolver/LLVM needed.
        cp -L /opt/rocm/lib/libhipblas.so* dist/bin/ 2>/dev/null || true
        cp -L /opt/rocm/lib/librocblas.so* dist/bin/ 2>/dev/null || true
        cp -L /opt/rocm/lib/libamdhip64.so* dist/bin/ 2>/dev/null || true
        cp -L /opt/rocm/lib/libhsa-runtime64.so* dist/bin/ 2>/dev/null || true
        cp -L /opt/rocm/lib/libamd_comgr*.so* dist/bin/ 2>/dev/null || true
        cp -L /opt/rocm/lib/librocprofiler-register.so* dist/bin/ 2>/dev/null || true
        cp -L /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_*.so* dist/bin/ 2>/dev/null || true

        # rocblas kernel library tree. Family dists carry kernels for sibling
        # chips (e.g. gfx1200+gfx1201); left intact for simplicity — the
        # loader only reads the ones matching the host GPU.
        cp -r /opt/rocm/lib/rocblas/library/. dist/bin/rocblas/library/ 2>/dev/null || true

        # Per-gfx kernel packs for libraries that ship split code objects.
        cp -v /opt/rocm/.kpack/*_${gfx}.kpack dist/kpacks/ 2>/dev/null || true

        # Catch-all probe loop: run dflash_server and copy whatever else the
        # loader complains about until it loads cleanly.
        python3 utils/gather_required_libs.py --rocm-dir /opt/rocm --dest-dir dist/bin --binary dflash_server || true

        cd dist/bin
        for f in *; do
          [ -f "$f" ] && [ ! -L "$f" ] && patchelf --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
        done

    - name: Verify HIP binaries
      run: |
        set -euo pipefail
        bin_dir="dist/bin"
        ls -la "$bin_dir"
        for b in test_dflash dflash_server test_server_unit; do
          test -x "$bin_dir/$b" || { echo "ERROR: $b not staged" >&2; exit 1; }
        done
        help_out=$("$bin_dir/dflash_server" --help 2>&1 || true)
        echo "$help_out" | head -n 10
        # Usage goes to stderr
        echo "$help_out" | grep -q "Usage:" || { echo "ERROR: usage output missing" >&2; exit 1; }
        for b in test_dflash dflash_server test_server_unit; do
          unresolved=$(ldd "$bin_dir/$b" | grep "not found" || true)
          if [ -n "$unresolved" ]; then
            echo "ERROR: unresolved libs for $b:" >&2
            echo "$unresolved" >&2
            exit 1
          fi
        done
        echo "HIP binary verification successful! (${{ matrix.gfx_target }})"

    - name: Create release summary
      run: |
        cat > "build-summary-rocm-${{ matrix.gfx_target }}.md" << EOF
        # lucebox Build Summary (ROCm - ${{ matrix.gfx_target }})

        ## Build Configuration
        - **GPU Target**: ${{ matrix.gfx_target }}
        - **Backend**: HIP
        - **TheRock Dist Prefix**: ${{ matrix.s3_target }}
        - **ROCm Version**: ${DETECTED_ROCM_VERSION}
        - **lucebox Commit Hash**: ${{ needs.prepare-matrix.outputs.lucebox_commit_hash }}
        - **HIP SM80 Equiv (rocWMMA)**: ${{ env.HIP_SM80_EQUIV }}
        - **Build Type**: Release
        EOF

    - name: Upload build artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lucebox-linux-rocm-${{ matrix.gfx_target }}-x64
        path: dist/
        retention-days: 30

    - name: Upload build summary
      uses: actions/upload-artifact@v4
      with:
        name: build-summary-rocm-${{ matrix.gfx_target }}
        path: build-summary-rocm-${{ matrix.gfx_target }}.md
        retention-days: 30

    - name: Clean up workspace
      if: always()
      run: |
        rm -rf dist
        if [ -d "/opt/rocm" ]; then sudo rm -rf /opt/rocm; fi
        if [ -d "lucebox" ]; then rm -rf lucebox; fi

  # ──────────────────────────────────────────────────────────────────────
  # smoke-test: non-blocking GPU checks on self-hosted runners. The matrix
  # comes from prepare-matrix and contains ONLY targets with a configured
  # runner-label repo variable, so unconfigured targets never queue.
  # continue-on-error keeps hardware flakiness from blocking releases.
  # ──────────────────────────────────────────────────────────────────────
  smoke-test:
    name: smoke-test (${{ matrix.gfx_target }})
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    continue-on-error: true
    timeout-minutes: 20
    needs: [prepare-matrix, build-cuda, build-rocm]
    strategy:
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.smoke_matrix) }}
      fail-fast: false
    if: |
      always() &&
      needs.prepare-matrix.result == 'success' &&
      needs.prepare-matrix.outputs.smoke_matrix != '[]' &&
      contains(fromJSON('["success","skipped"]'), needs.build-cuda.result) &&
      contains(fromJSON('["success","skipped"]'), needs.build-rocm.result) &&
      github.event_name != 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run GPU smoke test
      uses: ./.github/actions/smoke-test-lucebox
      with:
        gfx_target: ${{ matrix.gfx_target }}
        artifact_name: ${{ matrix.gfx_target == 'cuda' && 'lucebox-linux-cuda12-x64' || format('lucebox-linux-rocm-{0}-x64', matrix.gfx_target) }}

  create-release:
    needs: [prepare-matrix, build-cuda, build-rocm]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: |
      always() &&
      (needs.build-cuda.result == 'success' || needs.build-cuda.result == 'skipped') &&
      (needs.build-rocm.result == 'success' || needs.build-rocm.result == 'skipped') &&
      (needs.build-cuda.result == 'success' || needs.build-rocm.result == 'success') &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.create_release == 'true' || github.event.inputs.create_release == null) ||
       github.event_name == 'schedule')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./all-artifacts

    - name: Generate release tag
      id: generate-tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        existing_tags=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -E '^b[0-9]{4}$' | sort -V || echo "")

        if [ -z "$existing_tags" ]; then
          next_number=1000
        else
          highest_tag=$(echo "$existing_tags" | tail -n 1)
          highest_number=$(echo "$highest_tag" | sed 's/^b//')
          next_number=$((highest_number + 1))
        fi

        TAG=$(printf "b%04d" $next_number)
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Generated release tag: ${TAG}"

    - name: Check if tag already exists
      id: check-tag
      run: |
        TAG="${{ steps.generate-tag.outputs.tag }}"
        if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
          echo "Tag $TAG already exists, skipping release creation"
          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "Tag $TAG does not exist, proceeding with release creation"
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create archives for all target artifacts
      if: steps.check-tag.outputs.tag_exists == 'false'
      run: |
        targets="${{ env.GFX_TARGETS }}"
        TAG="${{ steps.generate-tag.outputs.tag }}"

        # cuda entry
        artifact_name="lucebox-linux-cuda12-x64"
        artifact_dir="./all-artifacts/${artifact_name}"
        final_archive_name="lucebox-${TAG}-linux-cuda12-x64"
        if [ -d "$artifact_dir" ]; then
          cd "$artifact_dir"
          zip -r "../../${final_archive_name}.zip" .
          cd - > /dev/null
        else
          echo "Warning: Artifact directory not found: $artifact_dir"
        fi

        # rocm entries
        IFS=',' read -ra TARGET_ARRAY <<< "$targets"
        for target in "${TARGET_ARRAY[@]}"; do
          target=$(echo "$target" | xargs)
          artifact_name="lucebox-linux-rocm-${target}-x64"
          artifact_dir="./all-artifacts/${artifact_name}"
          final_archive_name="lucebox-${TAG}-linux-rocm-${target}-x64"
          if [ -d "$artifact_dir" ]; then
            cd "$artifact_dir"
            # Restore hidden-dir geometry BEFORE zipping: rocm_kpack resolves
            # "../.kpack/<name>_<gfx>.kpack" relative to each loading library
            # in bin/, so .kpack must sit beside bin/. upload-artifact dropped
            # the leading dot, hence the rename here; shopt -s dotglob makes
            # zip pick the renamed hidden dir up.
            shopt -s dotglob
            [ -d kpacks ] && mv kpacks .kpack
            zip -r "../../${final_archive_name}.zip" .
            cd - > /dev/null
          else
            echo "Warning: Artifact directory not found: $artifact_dir"
          fi
        done

    - name: Create Release
      if: steps.check-tag.outputs.tag_exists == 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSIONS_JSON: ${{ needs.prepare-matrix.outputs.versions_json }}
        LUCEBOX_COMMIT_HASH: ${{ needs.prepare-matrix.outputs.lucebox_commit_hash }}
      run: |
        TAG="${{ steps.generate-tag.outputs.tag }}"
        targets="${{ env.GFX_TARGETS }}"

        rocm_versions=$(echo "$VERSIONS_JSON" | jq -r 'to_entries | map("- " + .key + ": " + .value) | join(", ")')

        upload_files=""
        final_archive_name="lucebox-${TAG}-linux-cuda12-x64"
        [ -f "${final_archive_name}.zip" ] && upload_files="${upload_files} ${final_archive_name}.zip"
        IFS=',' read -ra TARGET_ARRAY <<< "$targets"
        for target in "${TARGET_ARRAY[@]}"; do
          target=$(echo "$target" | xargs)
          final_archive_name="lucebox-${TAG}-linux-rocm-${target}-x64"
          [ -f "${final_archive_name}.zip" ] && upload_files="${upload_files} ${final_archive_name}.zip"
        done

        gh release create "$TAG" \
          --title "lucebox $TAG" \
          --notes "**Build Number**: $TAG
        **GPU Target(s)**: cuda12 (fat binary sm_${{ env.CUDA_ARCHES }}), $targets (HIP)
        **ROCm Version** (TheRock prefix: version): ${rocm_versions:-n/a}
        **CUDA Version**: 12.8.0
        **lucebox Commit Hash**: $LUCEBOX_COMMIT_HASH
        **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

        This release includes compiled lucebox (DFlash) server binaries for Linux x86_64 with all essential ROCm runtime libraries bundled (\$ORIGIN rpath — unpack anywhere).

        Scope notes:
        - \`cuda12\`: NVIDIA fat binary covering sm_75/sm_80/sm_86/sm_89/sm_90/sm_120 (requires any CUDA 12.x driver).
        - \`rocm-*\`: single-GPU-arch HIP binaries; match your GPU's gfx target. gfx1151 requires host ROCm >= 6.4.1.
        - Server C++ binaries only — the megakernel PyTorch extension is not included.
        - Pre-Turing (sm_60/61), GB10 sm_121, and Jetson Thor sm_110 are not part of the nightly matrix yet." \
          $upload_files
